name: Format VPN SHOP button styles

on:
  push:
    branches:
      - feat/vpn-shop-native-button-styles
    paths:
      - .github/workflows/format-vpn-shop-button-styles.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/vpn-shop-native-button-styles
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Apply repository formatter to two affected files
        run: ./node_modules/.bin/oxfmt src/pages/telegrambot/TelegramBotPage.css src/test/bot-appearance.test.tsx
        working-directory: frontend
      - name: Commit formatted files to feature branch
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/telegrambot/TelegramBotPage.css frontend/src/test/bot-appearance.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'style(bot): apply oxfmt to affected frontend files'
            git push origin HEAD:refs/heads/feat/vpn-shop-native-button-styles
          fi
