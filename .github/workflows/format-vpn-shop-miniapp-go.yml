name: Format VPN SHOP Mini App Go sources

on:
  push:
    branches:
      - feat/vpn-shop-telegram-miniapp-v1.5.0
    paths:
      - ".github/workflows/format-vpn-shop-miniapp-go.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/vpn-shop-telegram-miniapp-v1.5.0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format modified Go files with gofumpt
        run: |
          go run mvdan.cc/gofumpt@latest -w internal/resellerbot/presentation.go internal/web/controller/miniapp.go internal/web/controller/miniapp_test.go
      - name: Commit formatting changes
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/resellerbot/presentation.go internal/web/controller/miniapp.go internal/web/controller/miniapp_test.go
          if ! git diff --cached --quiet; then
            git commit -m 'style(miniapp): gofumpt formatted Go source'
            git push origin HEAD:refs/heads/feat/vpn-shop-telegram-miniapp-v1.5.0
          fi
