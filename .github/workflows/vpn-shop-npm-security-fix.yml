name: VPN Shop npm security refresh (temporary)

on:
  push:
    branches:
      - vpn-shop-six-upgrades-2026-11-13
    paths:
      - .github/workflows/vpn-shop-npm-security-fix.yml

permissions:
  contents: write

jobs:
  audit-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Safely refresh vulnerable transitive npm dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit fix --package-lock-only || true
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Push updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Update vulnerable transitive npm packages without major upgrades"
            git push
          fi
